[project]
name = "sentinel"
version = "0.1.0"
description = "Agentic penetration-testing assistant for authorized HTB labs and vulnerable VMs."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]
